name: echoflow

x-storage-environment: &storage-environment
  MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
  MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-echoflow}
  MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-local-dev-password}
  MINIO_BUCKET: ${MINIO_BUCKET:-echoflow-audio}
  MINIO_SECURE: ${MINIO_SECURE:-false}

x-audio-environment: &audio-environment
  <<: *storage-environment
  TTS_PROVIDER: ${TTS_PROVIDER:-mock}
  ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
  ELEVENLABS_MODEL: ${ELEVENLABS_MODEL:-eleven_flash_v2_5}
  ELEVENLABS_BASE_URL: ${ELEVENLABS_BASE_URL:-https://api.elevenlabs.io}
  TTS_TIMEOUT_SECONDS: ${TTS_TIMEOUT_SECONDS:-300}
  TTS_MAX_RESPONSE_BYTES: ${TTS_MAX_RESPONSE_BYTES:-67108864}
  TTS_VOICE_CACHE_SECONDS: ${TTS_VOICE_CACHE_SECONDS:-300}

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-echoflow}
      POSTGRES_USER: ${POSTGRES_USER:-echoflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    build: ./backend
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://echoflow:local-dev-password@db:5432/echoflow}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    environment:
      <<: *audio-environment
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://echoflow:local-dev-password@db:5432/echoflow}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173,http://127.0.0.1:5173}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-google/gemini-2.5-flash}
      OPENROUTER_EVALUATION_MODEL: ${OPENROUTER_EVALUATION_MODEL:-google/gemini-2.5-flash}
    depends_on:
      minio-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12

  worker:
    build: ./backend
    command: ["celery", "-A", "app.celery_app:celery_app", "worker", "--loglevel=INFO", "--concurrency=2", "--queues=script_generation,script_evaluation,audio_generation"]
    environment:
      <<: *audio-environment
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://echoflow:local-dev-password@db:5432/echoflow}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-google/gemini-2.5-flash}
      OPENROUTER_EVALUATION_MODEL: ${OPENROUTER_EVALUATION_MODEL:-google/gemini-2.5-flash}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      OPENROUTER_TIMEOUT_SECONDS: ${OPENROUTER_TIMEOUT_SECONDS:-90}
      OPENROUTER_HTTP_REFERER: ${OPENROUTER_HTTP_REFERER:-http://localhost:5173}
      OPENROUTER_APP_TITLE: ${OPENROUTER_APP_TITLE:-EchoFlow}
    depends_on:
      minio-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  dispatcher:
    build: ./backend
    command: ["python", "-m", "app.dispatcher"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://echoflow:local-dev-password@db:5432/echoflow}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  minio:
    build: ./infra/minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-echoflow}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-local-dev-password}
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 3s
      timeout: 3s
      retries: 20

  minio-init:
    build: ./backend
    command: ["python", "-m", "app.storage"]
    environment:
      <<: *storage-environment
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"

  frontend:
    build: ./frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:5173:5173"

volumes:
  postgres_data:
  redis_data:
  minio_data:

