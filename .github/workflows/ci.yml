name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_e2e:
        description: Run the full Mock browser and crash-recovery suite
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  LLM_PROVIDER: mock
  TTS_PROVIDER: mock
  OPENROUTER_API_KEY: ""
  ELEVENLABS_API_KEY: ""
  PYTHONUNBUFFERED: "1"

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: "sqlite+aiosqlite:///:memory:"
      # Disposable CI service only. Tests create/drop their own random databases.
      TEST_POSTGRES_URL: postgresql+asyncpg://echoflow:ci-only-password@127.0.0.1:5432/echoflow_ci
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: echoflow
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: echoflow_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U echoflow -d echoflow_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Lint
        run: python -m ruff check .
      - name: Check formatting
        run: python -m ruff format --check app tests
      - name: Run unit and integration tests, including PostgreSQL
        run: python -m pytest tests/unit tests/integration -q --junitxml=test-results/backend.xml
      - name: Upload test report
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-report
          path: backend/test-results/backend.xml
          if-no-files-found: ignore
          retention-days: 7

  frontend:
    name: Frontend build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Type-check and build
        run: npm run build
      - name: Run frontend unit tests
        run: npm test
      - name: Upload production build
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error
          retention-days: 7

  e2e:
    name: Full Mock E2E (manual)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_e2e }}
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
            backend/requirements-e2e.txt
      - name: Install E2E dependencies
        run: python -m pip install -r backend/requirements-e2e.txt
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Run isolated Mock production, browser and recovery checks
        shell: pwsh
        run: ./scripts/run-e2e.ps1 -Suite all -Python python
      - name: Upload E2E screenshots and downloads
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: mock-e2e-results
          path: |
            .tools/e2e-results-*/**/*.png
            .tools/e2e-results-*/**/*.mp3
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
